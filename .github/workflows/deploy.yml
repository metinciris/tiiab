name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kaynak kodu al
        uses: actions/checkout@v5

      - name: Node.js kur
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Bagimliliklari kur
        run: npm install --no-audit --no-fund

      - name: Rapor sozlesmesi testlerini calistir
        run: npm test

      - name: Uygulamayi derle
        run: npm run build

      - name: Pages yapilandir
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Derlemeyi yukle
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: GitHub Pages'e yayinla
        id: deployment
        uses: actions/deploy-pages@v4
